name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# ⛔ READ-ONLY. `GITHUB-SETUP.md`: the CI only runs tests, it needs no secret,
# and the absence of one is a property worth keeping.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # RUNBOOK 0b — the three-OS matrix
  # =========================================================================
  tests:
    name: ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # ⭐ OUR FLOOR PLUS EVERY PYTHON THE FIRST DOWNSTREAM CONSUMER RUNS.
        # `requires-python = ">=3.10"` is a claim about 3.11 and 3.13 too, and
        # until this line it was a claim nothing had tested. Anki Miner runs
        # 3.11 / 3.12 / 3.13. ⛔ The first run of this matrix at two versions
        # found three defects in configurations that had simply never run —
        # an untested cell is not a passing one.
        python: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[parsing,trash]" pytest

      # ⚠ UTF-8 EVERYWHERE. This project's corpus is Japanese and a runner
      # whose console defaults to an ANSI codepage raises UnicodeEncodeError
      # on a filename rather than on anything that is actually wrong.
      - name: Run the suite
        env:
          PYTHONIOENCODING: utf-8
        run: python run_tests.py

      # ⭐ THE USAGE GUIDE IS EXECUTED, NOT TRUSTED. Every example in examples/
      # builds its own demo data and must run to completion, and the guide's
      # prose is checked against the installed API. ⚠ Running the examples
      # the first time found three defects no suite had: a crash on a Result
      # whose subtitle is None, segments explained backwards, and a demo name
      # that did not pair because it was not the show's real title.
      - name: Run the examples, and check the guide against the API
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: |
          set -euo pipefail
          for example in examples/*.py; do
            echo "::group::$example"
            python "$example" || {
              echo "::error title=example failed::$example exited non-zero"
              exit 1
            }
            echo "::endgroup::"
          done
          python .github/scripts/check_docs.py

      # =====================================================================
      # 🚨 PUT THE FAILURE WHERE IT CAN BE READ WITHOUT CREDENTIALS
      # =====================================================================
      # `run_tests.py` writes every failing suite's FULL output to disk and
      # the step summary shows only `exit code 1`. Uploading that as an
      # artefact was not enough: reading it needs an authenticated download,
      # so the one person who could see the failure was the one person the
      # workflow exists to save the trouble.
      #
      # ⛔ AND THE FIRST TWO FIXES WERE THE SAME MISTAKE ONE LEVEL UP, TWICE.
      #   1. The job log: `GET .../jobs/{id}/logs` answers *"Must have admin
      #      rights to Repository"*. A collaborator, a fork, or anyone holding
      #      no token still cannot read why the build is red.
      #   2. `$GITHUB_STEP_SUMMARY`: rendered on the run's web page, but the
      #      check-run API returns `"summary": null` and the page fetches it
      #      client-side. MEASURED, not assumed — a run was pushed, and the
      #      summary came back empty from the API that was supposed to serve
      #      it.
      #
      # ⭐ AN ANNOTATION IS THE ONE CHANNEL THAT SURVIVES. `::error::` lands in
      # `GET /check-runs/{id}/annotations`, which is public for a public repo.
      # So the failing test NAMES go there; the summary and the log keep the
      # long form for whoever does have rights.
      #
      # ⭐ `doctrine/evidence`: the instrument has to hand back the finding,
      # not store it somewhere the finding cannot be reached from.
      - name: Say what actually failed
        if: failure()
        shell: bash
        # ⛔ THE SAME UTF-8 TRAP AS THE SUITE STEP, AND IT BIT HERE FIRST.
        # This step ran GREEN on Windows and emitted nothing at all: a
        # failure message carrying Japanese hit a cp1252 stdout,
        # `UnicodeEncodeError` killed the reporter, and `|| true` swallowed
        # it. ⚠ The diagnostic failed in exactly the way it exists to report.
        env:
          PYTHONIOENCODING: utf-8
        run: |
          # ⚠ Collected to a file first, then emitted twice. Teeing straight
          # into the summary through process substitution can lose the tail:
          # the step exits, and the `tee` on the other end has not flushed.
          {
          echo "=============================================="
          echo " the runner's own record of the failing suites"
          echo "=============================================="

          # ⭐ NAME THE TESTS FIRST. `tail -n 60` of a suite's console output
          # can scroll the one line that matters off the top -- it has, and it
          # cost a second eight-minute run. The JUnit XML carries every
          # failure's name and message regardless of how much noise preceded
          # it, so that is what gets read.
          python - <<'PY'
          import glob, io, os, sys, xml.etree.ElementTree as ET

          found = []
          for x in sorted(glob.glob("_runs/*/*.xml")):
              root = ET.parse(x).getroot()
              suite = root if root.tag == "testsuite" else root.find("testsuite")
              if suite is None:
                  continue
              for case in suite.iter("testcase"):
                  for kind in ("failure", "error"):
                      node = case.find(kind)
                      if node is None:
                          continue
                      found.append((kind.upper(), os.path.basename(x),
                                    case.get("name"),
                                    (node.get("message") or "").strip(),
                                    (node.text or "").strip()))

          # ⛔ THE ANNOTATION IS WRITTEN FIRST, BEFORE ANYTHING IS PRINTED.
          # Ordering, not decoration: the readable dump below is the part that
          # can die on an encoding, and when it did the annotation never got
          # written. The machine-readable artefact must not depend on the
          # human-readable one surviving.
          #
          # Newlines must be percent-encoded or GitHub keeps only the first
          # line, and `%` must be escaped first or it eats the escapes it is
          # about to write. Capped at 25: the API truncates a long annotation,
          # and a truncated one that lost the test NAMES is worth nothing.
          def esc(s):
              return (s.replace("%", "%25").replace("\r", "%0D")
                       .replace("\n", "%0A"))

          lines = ["%s %s::%s -- %s" % (k, x, n, (m.splitlines() or [""])[0][:200])
                   for k, x, n, m, _ in found[:25]]
          if len(found) > 25:
              lines.append("...and %d more" % (len(found) - 25))
          if not lines:
              lines = ["no failing testcase in any JUnit XML. If the suite "
                       "step passed, a LATER step failed -- the examples or "
                       "the guide check name themselves above. Otherwise a "
                       "collection error or the runner itself: see the log."]
          with io.open("_annot.txt", "w", encoding="utf-8") as fh:
              fh.write(u"::error title=%d failing test(s)::%s\n"
                       % (len(found), esc("\n".join(lines))))

          # ⚠ And the dump itself replaces what it cannot encode rather than
          # raising. Belt as well as braces: PYTHONIOENCODING is set on this
          # step now, but a reporter that can be killed by its own subject
          # matter has no business being the thing you rely on in an outage.
          try:
              sys.stdout.reconfigure(encoding="utf-8", errors="replace")
          except Exception:
              pass

          for kind, xml, name, msg, body in found:
              print("")
              print("%s  %s::%s" % (kind, xml, name))
              for line in (msg.splitlines() + body.splitlines())[-25:]:
                  print("    " + line)
          print("")
          print("%d failing test(s) named above" % len(found))
          if not found:
              print("NO test failed -- the suite runner exited non-zero for "
                    "another reason (a collection error, or the runner "
                    "itself). The tails below are the whole story.")
          PY

          for f in _runs/*/*.txt; do
            [ -f "$f" ] || continue
            echo ""
            echo "----- $f -----"
            tail -n 40 "$f"
          done

          echo ""
          echo "===== environment, for the differences that matter ====="
          python -c "import sys,platform;print('python',sys.version.split()[0],platform.platform())"
          python -c "
          import sys, os, tempfile
          print('  cwd            ', os.getcwd())
          print('  fsencoding     ', sys.getfilesystemencoding())
          print('  tempdir        ', tempfile.gettempdir())
          print('  case-insensitive', os.path.exists(sys.executable.upper()))
          for m in ('numpy','anitopy','guessit','send2trash','tkinter'):
              try:
                  __import__(m); print('  present', m)
              except Exception as e:
                  print('  ABSENT ', m, '->', type(e).__name__)
          "
          } > _diag.txt 2>&1 || true

          cat _diag.txt
          {
            echo "## ${{ matrix.os }} · py${{ matrix.python }} — what failed"
            echo '```'
            cat _diag.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # ⭐ LAST, AND ON REAL STDOUT. Everything above went into the file;
          # a workflow command swallowed by a redirect is not a command.
          [ -s _annot.txt ] && cat _annot.txt
          exit 0

      # ⭐ AND STILL KEEP IT AS AN ARTEFACT. A full run once reported one
      # failure with its name scrolled off, costing a second eight-minute run
      # to learn a name the first run already had.
      - name: Keep the run log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: run-log-${{ matrix.os }}-py${{ matrix.python }}
          path: _runs/
          if-no-files-found: ignore
          retention-days: 14

  # =========================================================================
  # 🚨 IS THE WHEEL THE THING WE BUILT?
  # =========================================================================
  #
  # `naming/alias.py::load()` fails OPEN by design — a missing table returns
  # an empty one and raises nothing. So a wheel built without package-data
  # installs cleanly, imports cleanly, runs cleanly, and is quietly far worse
  # at the one thing that makes cross-script pairing work.
  #
  # ⛔ MEASURED: settled-by-name falls 80.0% → 51.4% with the table absent.
  # 28.6 points of pairing quality, with no error anywhere.
  #
  # ⭐ So the wheel is opened and looked inside, in a clean environment that
  # never sees the source tree. A check that ran from a checkout would pass
  # on the repository's copy of the file and prove nothing about the artefact.
  wheel:
    name: wheel contains its data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      - name: Look inside the wheel
        run: |
          set -euo pipefail
          WHEEL=$(ls dist/*.whl)
          echo "built: $WHEEL"
          python - "$WHEEL" <<'PY'
          import sys, zipfile
          names = zipfile.ZipFile(sys.argv[1]).namelist()
          need = ["tsubasa/data/aliases.tsv.gz", "tsubasa/data/decoration.json"]
          missing = [n for n in need if n not in names]
          if missing:
              sys.exit("MISSING FROM THE WHEEL: %s\n"
                       "package-data is not wired. The install would work and "
                       "be measurably worse, silently." % missing)
          info = zipfile.ZipFile(sys.argv[1]).getinfo("tsubasa/data/aliases.tsv.gz")
          if info.file_size < 1_000_000:
              sys.exit("alias table in the wheel is %d bytes — truncated"
                       % info.file_size)
          print("alias table present: %d bytes" % info.file_size)

          # ⛔ AND IT IS CALLED WHAT WE PUBLISH IT AS. `pyproject.toml` said
          # `tsubasa` for the whole first day while the README and the release
          # workflow said `tsubasa-sync`, and nothing compared them. `tsubasa`
          # on PyPI is somebody else's project.
          import email
          meta = [n for n in names if n.endswith(".dist-info/METADATA")]
          name = email.message_from_bytes(
              zipfile.ZipFile(sys.argv[1]).read(meta[0]))["Name"]
          if name != "tsubasa-sync":
              sys.exit("the wheel is named %r, not 'tsubasa-sync' -- it would "
                       "not install under the name the README gives, and "
                       "PyPI would refuse the upload" % name)
          print("distribution name: %s" % name)
          PY

      # ⛔ INSTALLED FROM THE WHEEL, IN A DIRECTORY THAT IS NOT THE SOURCE
      # TREE. Running from the checkout would find the repository's own data
      # files through `__file__` and tell us nothing about what shipped.
      - name: Install the wheel and prove the table LOADS
        run: |
          set -euo pipefail
          python -m pip install dist/*.whl
          mkdir -p /tmp/elsewhere && cd /tmp/elsewhere
          python - <<'PY'
          import tsubasa
          from tsubasa.naming import alias
          table = alias.load()
          print("version:", tsubasa.__version__)
          print("alias entries:", len(table))
          assert len(table) >= 100000, (
              "the installed wheel loaded %d alias entries — the data file did "
              "not ship, and NOTHING raises when that happens" % len(table))
          assert callable(tsubasa.scan) and callable(tsubasa.sync)
          PY

      # =====================================================================
      # 🚨 THE INSTALLED PACKAGE, USED THE WAY A USER USES IT — OUTSIDE A CHECKOUT
      # =====================================================================
      # 0.1.0 WAS PUBLISHED BROKEN: `sync(scan(folder))` raised ConfigError for
      # every `pip install`, because the per-user cache location read the
      # DEVELOPMENT config at the repository root. Every job above ran inside
      # a checkout, where walking up always finds that file; this job ran
      # outside one and never called `sync()`. Found by running the examples
      # against the package from PyPI, after publication.
      # ⭐ So the examples run HERE too — against the installed wheel, from a
      # directory with no checkout above it — which drives scan, sync with its
      # real defaults, the reference sync, render, the CLI and self_check.
      - name: Run every example against the installed wheel, outside the source tree
        env:
          PYTHONIOENCODING: utf-8
        run: |
          set -euo pipefail
          rm -rf /tmp/outside && mkdir -p /tmp/outside
          cp examples/*.py /tmp/outside/
          cd /tmp/outside
          test ! -e tsubasa.config.json
          for example in *.py; do
            echo "::group::$example"
            python "$example" || {
              echo "::error title=example failed outside a checkout::$example"
              exit 1
            }
            echo "::endgroup::"
          done

  # =========================================================================
  # 🚨 DOES A FROZEN APPLICATION GET THE DATA?
  # =========================================================================
  #
  # ⛔ MEASURED 2026-09-16 before the hook existed: a PyInstaller build of a
  # plain `import tsubasa`, from the real wheel, ran with 0 alias entries and
  # settled a cross-script pair `unsure` — exit 0, nothing raised. The first
  # consumer of this library (Anki Miner) ships PyInstaller builds.
  #
  # ⭐ So a frozen app is BUILT and RUN here, from the wheel, outside the
  # source tree, with nothing tsubasa-specific in the build command — exactly
  # what an application author would do. It asserts the instrument
  # (`self_check().ok`) AND the consequence (the pair settles `same`), because
  # an instrument that agrees with itself proves less than one that agrees
  # with the product.
  frozen:
    name: a frozen app carries the data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build the wheel and install it with PyInstaller
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
          python -m pip install dist/*.whl pyinstaller

      - name: Freeze an app that only says import tsubasa, and run it
        env:
          PYTHONIOENCODING: utf-8
        run: |
          set -euo pipefail
          mkdir -p /tmp/frozen && cd /tmp/frozen
          cat > probe.py <<'PY'
          import os, sys, tempfile
          import tsubasa

          # ⚠ A frozen app ignores PYTHONIOENCODING. The reporter must not be
          # the thing that fails -- measured on a Windows build, where it did.
          sys.stdout.reconfigure(errors="backslashreplace")
          assert getattr(sys, "frozen", False), "this probe did not run frozen"
          check = tsubasa.self_check()
          print(check)
          for sentence in check.problems:
              print("PROBLEM:", sentence)

          root = tempfile.mkdtemp()
          for rel in ("videos/[NanakoRaws] Yomi no Tsugai S01E18 (AT-X TV 1080p HEVC AAC).mkv",
                      "subs/黄泉のツガイ.S01E18.WEBRip.ABEMA.ja[cc].srt"):
              path = os.path.join(root, rel)
              os.makedirs(os.path.dirname(path), exist_ok=True)
              open(path, "wb").close()
          scan = tsubasa.scan(videos=os.path.join(root, "videos"),
                              subs=os.path.join(root, "subs"))
          identities = [c.identity for _v, cands in scan.pairings() for c in cands]
          print("cross-script pair identity:", identities)

          ok = check.ok and identities == ["same"]
          sys.exit(0 if ok else 1)
          PY
          python -m PyInstaller --onedir --noconfirm --log-level WARN probe.py
          ./dist/probe/probe

  # =========================================================================
  # The licence is a file people rely on, so it is checked like one.
  # =========================================================================
  licence:
    name: licence is the real text
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: LICENSE must be the canonical GPL-3.0
        run: |
          set -euo pipefail
          test -s LICENSE || { echo "LICENSE is missing or empty"; exit 1; }
          grep -q "GNU GENERAL PUBLIC LICENSE" LICENSE
          grep -q "Version 3, 29 June 2007" LICENSE
          grep -q "TERMS AND CONDITIONS" LICENSE
          # ⚠ A placeholder explaining that the licence is missing is a
          # failure that looks like success from every direction but opening
          # it. It was a real state of this repository for one afternoon.
          if grep -qi "PLACEHOLDER" LICENSE; then
            echo "LICENSE is still the placeholder"; exit 1
          fi
          echo "LICENSE ok: $(wc -c < LICENSE) bytes"
