name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# ⛔ READ-ONLY. `GITHUB-SETUP.md`: the CI only runs tests, it needs no secret,
# and the absence of one is a property worth keeping.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # RUNBOOK 0b — the three-OS matrix
  # =========================================================================
  tests:
    name: ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[parsing,trash]" pytest

      # ⚠ UTF-8 EVERYWHERE. This project's corpus is Japanese and a runner
      # whose console defaults to an ANSI codepage raises UnicodeEncodeError
      # on a filename rather than on anything that is actually wrong.
      - name: Run the suite
        env:
          PYTHONIOENCODING: utf-8
        run: python run_tests.py

      # =====================================================================
      # 🚨 PUT THE FAILURE WHERE IT CAN BE READ WITHOUT CREDENTIALS
      # =====================================================================
      # `run_tests.py` writes every failing suite's FULL output to disk and
      # the step summary shows only `exit code 1`. Uploading that as an
      # artefact was not enough: reading it needs an authenticated download,
      # so the one person who could see the failure was the one person the
      # workflow exists to save the trouble.
      #
      # ⛔ AND THE FIRST FIX WAS THE SAME MISTAKE ONE LEVEL UP. Printing to
      # the job log is no better: `GET .../jobs/{id}/logs` answers
      # *"Must have admin rights to Repository"*, so a collaborator, a fork,
      # or an agent holding no token still cannot read why the build is red.
      # `$GITHUB_STEP_SUMMARY` is served in the check run's public `output`,
      # so it is legible to anyone who can see that the run failed at all.
      #
      # ⭐ `doctrine/evidence`: the instrument has to hand back the finding,
      # not store it somewhere the finding cannot be reached from.
      - name: Say what actually failed
        if: failure()
        shell: bash
        run: |
          # ⚠ Collected to a file first, then emitted twice. Teeing straight
          # into the summary through process substitution can lose the tail:
          # the step exits, and the `tee` on the other end has not flushed.
          {
          echo "=============================================="
          echo " the runner's own record of the failing suites"
          echo "=============================================="

          # ⭐ NAME THE TESTS FIRST. `tail -n 60` of a suite's console output
          # can scroll the one line that matters off the top -- it has, and it
          # cost a second eight-minute run. The JUnit XML carries every
          # failure's name and message regardless of how much noise preceded
          # it, so that is what gets read.
          python - <<'PY'
          import glob, os, xml.etree.ElementTree as ET
          rows = 0
          for x in sorted(glob.glob("_runs/*/*.xml")):
              root = ET.parse(x).getroot()
              suite = root if root.tag == "testsuite" else root.find("testsuite")
              if suite is None:
                  continue
              for case in suite.iter("testcase"):
                  for kind in ("failure", "error"):
                      node = case.find(kind)
                      if node is None:
                          continue
                      rows += 1
                      print("")
                      print("%s  %s::%s" % (kind.upper(), os.path.basename(x),
                                            case.get("name")))
                      msg = (node.get("message") or "").strip()
                      body = (node.text or "").strip()
                      for line in (msg.splitlines() + body.splitlines())[-25:]:
                          print("    " + line)
          print("")
          print("%d failing test(s) named above" % rows)
          if not rows:
              print("NO test failed -- the suite runner exited non-zero for "
                    "another reason (a collection error, or the runner "
                    "itself). The tails below are the whole story.")
          PY

          for f in _runs/*/*.txt; do
            [ -f "$f" ] || continue
            echo ""
            echo "----- $f -----"
            tail -n 40 "$f"
          done

          echo ""
          echo "===== environment, for the differences that matter ====="
          python -c "import sys,platform;print('python',sys.version.split()[0],platform.platform())"
          python -c "
          import sys, os, tempfile
          print('  cwd            ', os.getcwd())
          print('  fsencoding     ', sys.getfilesystemencoding())
          print('  tempdir        ', tempfile.gettempdir())
          print('  case-insensitive', os.path.exists(sys.executable.upper()))
          for m in ('numpy','anitopy','guessit','send2trash','tkinter'):
              try:
                  __import__(m); print('  present', m)
              except Exception as e:
                  print('  ABSENT ', m, '->', type(e).__name__)
          "
          } > _diag.txt 2>&1 || true

          cat _diag.txt
          {
            echo "## ${{ matrix.os }} · py${{ matrix.python }} — what failed"
            echo '```'
            cat _diag.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ⭐ AND STILL KEEP IT AS AN ARTEFACT. A full run once reported one
      # failure with its name scrolled off, costing a second eight-minute run
      # to learn a name the first run already had.
      - name: Keep the run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-log-${{ matrix.os }}-py${{ matrix.python }}
          path: _runs/
          if-no-files-found: ignore
          retention-days: 14

  # =========================================================================
  # 🚨 IS THE WHEEL THE THING WE BUILT?
  # =========================================================================
  #
  # `naming/alias.py::load()` fails OPEN by design — a missing table returns
  # an empty one and raises nothing. So a wheel built without package-data
  # installs cleanly, imports cleanly, runs cleanly, and is quietly far worse
  # at the one thing that makes cross-script pairing work.
  #
  # ⛔ MEASURED: settled-by-name falls 80.0% → 51.4% with the table absent.
  # 28.6 points of pairing quality, with no error anywhere.
  #
  # ⭐ So the wheel is opened and looked inside, in a clean environment that
  # never sees the source tree. A check that ran from a checkout would pass
  # on the repository's copy of the file and prove nothing about the artefact.
  wheel:
    name: wheel contains its data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      - name: Look inside the wheel
        run: |
          set -euo pipefail
          WHEEL=$(ls dist/*.whl)
          echo "built: $WHEEL"
          python - "$WHEEL" <<'PY'
          import sys, zipfile
          names = zipfile.ZipFile(sys.argv[1]).namelist()
          need = ["tsubasa/data/aliases.tsv.gz", "tsubasa/data/decoration.json"]
          missing = [n for n in need if n not in names]
          if missing:
              sys.exit("MISSING FROM THE WHEEL: %s\n"
                       "package-data is not wired. The install would work and "
                       "be measurably worse, silently." % missing)
          info = zipfile.ZipFile(sys.argv[1]).getinfo("tsubasa/data/aliases.tsv.gz")
          if info.file_size < 1_000_000:
              sys.exit("alias table in the wheel is %d bytes — truncated"
                       % info.file_size)
          print("alias table present: %d bytes" % info.file_size)
          PY

      # ⛔ INSTALLED FROM THE WHEEL, IN A DIRECTORY THAT IS NOT THE SOURCE
      # TREE. Running from the checkout would find the repository's own data
      # files through `__file__` and tell us nothing about what shipped.
      - name: Install the wheel and prove the table LOADS
        run: |
          set -euo pipefail
          python -m pip install dist/*.whl
          mkdir -p /tmp/elsewhere && cd /tmp/elsewhere
          python - <<'PY'
          import tsubasa
          from tsubasa.naming import alias
          table = alias.load()
          print("version:", tsubasa.__version__)
          print("alias entries:", len(table))
          assert len(table) >= 100000, (
              "the installed wheel loaded %d alias entries — the data file did "
              "not ship, and NOTHING raises when that happens" % len(table))
          assert callable(tsubasa.scan) and callable(tsubasa.sync)
          PY

  # =========================================================================
  # The licence is a file people rely on, so it is checked like one.
  # =========================================================================
  licence:
    name: licence is the real text
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: LICENSE must be the canonical GPL-3.0
        run: |
          set -euo pipefail
          test -s LICENSE || { echo "LICENSE is missing or empty"; exit 1; }
          grep -q "GNU GENERAL PUBLIC LICENSE" LICENSE
          grep -q "Version 3, 29 June 2007" LICENSE
          grep -q "TERMS AND CONDITIONS" LICENSE
          # ⚠ A placeholder explaining that the licence is missing is a
          # failure that looks like success from every direction but opening
          # it. It was a real state of this repository for one afternoon.
          if grep -qi "PLACEHOLDER" LICENSE; then
            echo "LICENSE is still the placeholder"; exit 1
          fi
          echo "LICENSE ok: $(wc -c < LICENSE) bytes"
